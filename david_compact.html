<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>David</title>
<style>
  /* Same Javis OS palette as the main screen: violet for listening and thinking, orange for his voice. */
  :root {
    --accent: #ff7a3c; --accent-ink: #ffab81; --accent2: #8b5cf6; --accent2-ink: #d5b5ff;
    --text: #f3f3fb; --text2: #c0c0da; --text3: #9a9ab6;
    --font: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: var(--font); color: var(--text); }

  .wrap { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }

  /* the collapsed orb — what sits there almost all the time */
  .dot {
    width: 46px; height: 46px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 34% 30%, #b9b0d6 0, #55467e 30%, #1d1830 80%);
    box-shadow: 0 0 14px rgba(139,92,246,.25), inset -4px -6px 12px rgba(0,0,0,.4);
    transition: box-shadow .3s ease, background .3s ease, transform .3s ease;
  }
  .wrap.awake .dot {
    background: radial-gradient(circle at 34% 30%, #fff 0, var(--accent2-ink) 12%, var(--accent2) 45%, #2a1a52 82%);
    box-shadow: 0 0 22px rgba(139,92,246,.6), inset -4px -6px 12px rgba(0,0,0,.35);
  }
  .wrap.speaking .dot {
    background: radial-gradient(circle at 34% 30%, #fff 0, var(--accent-ink) 14%, var(--accent) 46%, #6b2408 84%);
    box-shadow: 0 0 24px rgba(255,122,60,.6), inset -4px -6px 12px rgba(0,0,0,.35);
  }
  .wrap.thinking .dot { animation: pulse 1.2s ease-in-out infinite; }

  /* the card — appears only while something is actually happening */
  .panel {
    width: 290px; padding: 14px 16px; border-radius: 16px;
    background: rgba(15,16,25,.9); border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 12px 36px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(8px) scale(.96); pointer-events: none;
    transition: opacity .28s ease, transform .28s ease;
  }
  .wrap.show .panel { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

  .state { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--text3);
           display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .state .led { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); }
  .state.listening, .state.thinking { color: var(--accent2-ink); }
  .state.listening .led, .state.thinking .led { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  .state.thinking .led { animation: blink 1s ease-in-out infinite; }
  .state.speaking { color: var(--accent-ink); }
  .state.speaking .led { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  .wave { display: flex; align-items: center; gap: 2px; height: 30px; margin-bottom: 10px; }
  .wave i { flex: 1; height: 3px; border-radius: 2px; background: var(--accent2); transition: height .08s linear, background .3s; }
  .wrap.speaking .wave i { background: var(--accent); }

  .said { font-size: 13px; color: var(--text2); line-height: 1.5; max-height: 30vh; overflow-y: auto; }

  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="panel" id="panel">
      <div class="state" id="state"><span class="led"></span><span id="stateText">Standing by</span></div>
      <div class="wave" id="wave"></div>
      <div class="said" id="said"></div>
    </div>
    <div class="dot" id="dot"></div>
  </div>

<script>
const BARS = 26;
const wave = document.getElementById("wave");
for (let i = 0; i < BARS; i++) wave.appendChild(document.createElement("i"));
const bars = [...wave.children];

const wrap = document.getElementById("wrap");
const panel = document.getElementById("panel");
const stateEl = document.getElementById("state");
const stateText = document.getElementById("stateText");
const said = document.getElementById("said");

const LABELS = { idle: "Standing by", asleep: "Asleep", listening: "Listening", thinking: "Working", speaking: "Speaking" };

let level = 0, target = 0;
let hideTimer = null;

function paint() {
  level += (target - level) * 0.3;
  bars.forEach((b, i) => {
    const mid = 1 - Math.abs(i - (BARS - 1) / 2) / ((BARS - 1) / 2);
    b.style.height = (2 + level * 26 * (0.3 + mid * 0.7) * (0.5 + Math.random() * 0.5)).toFixed(1) + "px";
  });
  requestAnimationFrame(paint);
}
paint();

function apply(s) {
  wrap.classList.toggle("awake", s.status !== "idle" && s.status !== "asleep");
  wrap.classList.toggle("speaking", s.status === "speaking");
  wrap.classList.toggle("thinking", s.status === "thinking");

  if (s.status !== "idle" && s.status !== "asleep") {
    wrap.classList.add("show");
    clearTimeout(hideTimer); hideTimer = null;
  } else {
    // linger a couple of seconds after going idle, like Siri does, then fold away —
    // one timer only: a stale one could fold the card while he's mid-sentence
    if (!hideTimer) hideTimer = setTimeout(() => { wrap.classList.remove("show"); hideTimer = null; }, 2200);
  }

  stateEl.className = "state " + s.status;
  stateText.textContent = LABELS[s.status] || "Standing by";
  target = s.status === "listening" ? (s.micLevel || 0) : s.status === "speaking" ? (s.outLevel || 0.5) : 0.04;

  if (s.lastLine) {
    said.textContent = "\u201c" + s.lastLine + "\u201d";
  }
}

function connect() {
  const ws = new WebSocket("ws://127.0.0.1:8766");
  ws.onmessage = (e) => { try { apply(JSON.parse(e.data)); } catch (_) {} };
  ws.onclose = () => setTimeout(connect, 1500);
}
connect();
</script>
</body>
</html>
